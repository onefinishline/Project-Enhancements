# nginx reverse proxy for Project Enhancements: public HTTPS in front of the Node app on 127.0.0.1:3100.
#
# Install:  /etc/nginx/sites-available/project-enhancements.conf
#           linked from /etc/nginx/sites-enabled/   (see deploy/DEPLOY.md)
# Replace every "enhancements.example.org" with the real domain (one sed command in DEPLOY.md).
# Certificates come from Let's Encrypt (certbot); paths below are where certbot puts them.
#
# Works with nginx 1.18+ (Ubuntu 22.04 / 24.04, Debian 12, RHEL 9).
# Security headers (Content-Security-Policy, HSTS, X-Frame-Options, ...) are set by the app itself,
# so they are not repeated here.

upstream project_enhancements_app {
    server 127.0.0.1:3100;
    keepalive 16;
}

# ---- HTTP: everything is sent to HTTPS ---------------------------------------------------------------
# (certbot's nginx mode briefly adds its own rule here when it renews the certificate.)
server {
    listen 80;
    listen [::]:80;
    server_name enhancements.example.org;
    server_tokens off;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS ------------------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name enhancements.example.org;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/enhancements.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/enhancements.example.org/privkey.pem;

    # Modern TLS only (all current browsers). Mozilla "intermediate" profile.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:project_enhancements_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/enhancements.example.org/chain.pem;

    # The app refuses request bodies over 100 KB; stop anything far larger here.
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/project-enhancements.access.log;
    error_log  /var/log/nginx/project-enhancements.error.log warn;

    # Headers every proxied request needs:
    #  Host               the app compares it with the browser's Origin (blocks forged cross-site requests)
    #  X-Forwarded-For    the visitor's real IP, used for rate limiting (app trusts exactly one proxy)
    #  X-Forwarded-Proto  tells the app the visitor used HTTPS
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    # Built page assets have content hashes in their names, so browsers may cache them for a year.
    location /assets/ {
        proxy_pass http://project_enhancements_app;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://project_enhancements_app;
    }
}
